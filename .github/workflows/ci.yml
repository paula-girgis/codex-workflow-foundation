name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helpers:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify pinned package source
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          version = json.loads(Path('foundation.json').read_text())['version']
          manifest = json.loads(Path(f'.github/release/v{version}-manifest.json').read_text())
          assert json.loads(Path('foundation.json').read_text())['version'] == manifest['version']
          for name, expected in manifest['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
      - name: Helper behavior and failure cases
        run: python tests/run_acceptance.py
      - name: Clean distribution and onboarding checks
        run: python tests/release_check.py
      - name: Report actual test scope
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          report = Path('development/evidence/acceptance.json')
          if report.exists():
              data = json.loads(report.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
                  out.write(f"Tests: {data['tests_run']}; failures: {data['failures']}; errors: {data['errors']}; skipped: {len(data['skipped'])}\n")
                  for test, reason in data['skipped']:
                      out.write(f"\nSkipped {test}: {reason}\n")
